<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고등학생 맞춤형 스터디 플래너</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Pretendard -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-indigo-50/40 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 border border-indigo-500 text-white p-2.5 rounded-xl shadow-sm text-xl font-bold flex items-center justify-center">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">고등 스터디 플래너</h1>
                    <p class="text-indigo-200 text-xs">오늘의 공부 기록과 타이머, 비중 분석</p>
                </div>
            </div>
            <!-- D-Day Summary Bar -->
            <div class="flex items-center gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0" id="ddayHeaderContainer">
                <!-- D-Day items will be injected here -->
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- LEFT COLUMN: Date Picker, Subject Management, Timer, To-Do Input (7 Cols) -->
        <div class="lg:col-span-7 space-y-6">
            
            <!-- Date Selector & D-Day Modal Toggle Card -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-indigo-100/60 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <div class="bg-indigo-50 text-indigo-600 p-3 rounded-xl border border-indigo-100">
                        <i class="fa-solid fa-calendar-day text-lg"></i>
                    </div>
                    <div>
                        <label for="currentDateInput" class="block text-xs font-medium text-slate-400">학습 날짜 선택</label>
                        <input type="date" id="currentDateInput" class="font-bold text-indigo-900 bg-transparent border-none focus:outline-none cursor-pointer">
                    </div>
                </div>
                <button onclick="openDdayModal()" class="w-full sm:w-auto px-4 py-2.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-sm font-semibold rounded-xl transition flex items-center justify-center gap-2 border border-indigo-100">
                    <i class="fa-solid fa-flag-checkered text-indigo-500"></i> D-Day 관리
                </button>
            </div>

            <div class="bg-indigo-900 text-white p-5 rounded-2xl shadow-md relative overflow-hidden">
                <div class="absolute -right-10 -bottom-10 text-indigo-800/40 text-9xl pointer-events-none">
                    <i class="fa-solid fa-stopwatch"></i>
                </div>
                <div class="relative z-10">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-base font-bold flex items-center gap-2 text-indigo-100">
                            <i class="fa-solid fa-stopwatch text-indigo-300"></i> 실시간 스터디 타이머
                        </h2>
                        <span class="text-xs bg-indigo-800 text-indigo-200 px-2.5 py-1 rounded-lg border border-indigo-700">집중 측정</span>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                        <div>
                            <label class="block text-xs font-medium text-indigo-300 mb-1">타이머 과목 선택</label>
                            <select id="timerSubjectSelect" class="w-full px-4 py-2.5 bg-indigo-950/80 border border-indigo-700 text-white rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
                                <!-- Dynamic Options -->
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-indigo-300 mb-1">공부 내용 (선택 입력)</label>
                            <input type="text" id="timerTaskInput" placeholder="예: 미적분 기출 5문제 풀기" class="w-full px-4 py-2.5 bg-indigo-950/80 border border-indigo-700 text-white placeholder-indigo-400/50 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
                        </div>
                    </div>

                    <!-- Display Timer -->
                    <div class="text-center py-4 bg-indigo-950/60 rounded-2xl border border-indigo-800/60 mb-4">
                        <div id="timerDisplay" class="text-4xl md:text-5xl font-extrabold tracking-wider text-indigo-200 font-mono">00:00:00</div>
                        <p id="timerStatusLabel" class="text-xs text-indigo-300/80 mt-1">시작 버튼을 눌러 공부를 시작하세요</p>
                    </div>

                    <!-- Timer Action Buttons -->
                    <div class="flex flex-wrap gap-2 justify-center">
                        <button id="timerStartBtn" onclick="startTimer()" class="flex-grow py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl transition shadow-sm text-sm flex items-center justify-center gap-2">
                            <i class="fa-solid fa-play"></i> 시작
                        </button>
                        <button id="timerPauseBtn" onclick="pauseTimer()" disabled class="py-2.5 px-4 bg-indigo-950 hover:bg-indigo-900 text-indigo-300 font-semibold rounded-xl transition shadow-sm text-sm flex items-center justify-center gap-2 opacity-50 cursor-not-allowed border border-indigo-800">
                            <i class="fa-solid fa-pause"></i> 일시정지
                        </button>
                        <button onclick="resetTimer()" class="py-2.5 px-4 bg-indigo-950 hover:bg-indigo-900 text-indigo-300 font-semibold rounded-xl transition shadow-sm text-sm flex items-center justify-center gap-2 border border-indigo-800">
                            <i class="fa-solid fa-rotate-right"></i> 초기화
                        </button>
                        <button onclick="saveTimerToTodo()" class="py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl transition shadow-sm text-sm flex items-center justify-center gap-2">
                            <i class="fa-solid fa-floppy-disk"></i> 기록 저장
                        </button>
                    </div>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-indigo-100/60">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-book text-indigo-600"></i> 과목 관리
                    </h2>
                    <span class="text-xs text-slate-400">공부할 과목을 추가하거나 삭제하세요</span>
                </div>
                <div class="flex gap-2 mb-4">
                    <input type="text" id="newSubjectInput" placeholder="새 과목 이름 (예: 물리I, 화학I)" class="flex-grow px-4 py-2.5 bg-indigo-50/50 border border-indigo-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="addSubject()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl transition shadow-sm">
                        <i class="fa-solid fa-plus mr-1"></i> 추가
                    </button>
                </div>
                <!-- Subject Badge List -->
                <div id="subjectListContainer" class="flex flex-wrap gap-2 max-h-32 overflow-y-auto p-1">
                    <!-- Dynamic Subjects -->
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-indigo-100/60">
                <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-indigo-600"></i> 학습 일정 및 시간 기록
                </h2>
                <form id="todoForm" onsubmit="addTodo(event)" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">과목 선택</label>
                            <select id="todoSubjectSelect" required class="w-full px-4 py-2.5 bg-indigo-50/50 border border-indigo-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <!-- Dynamic Options -->
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">공부 시간 (분 단위)</label>
                            <input type="number" id="todoMinutesInput" min="0" max="1440" value="30" required class="w-full px-4 py-2.5 bg-indigo-50/50 border border-indigo-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">학습 내용 (할 일)</label>
                        <input type="text" id="todoTaskInput" placeholder="예: 수완 실전 모의고사 3회 풀이 및 오답 정리" required class="w-full px-4 py-2.5 bg-indigo-50/50 border border-indigo-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition shadow-md flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-pen-to-square"></i> 학습 기록 추가하기
                    </button>
                </form>

                <!-- Daily Todo List with Improved Readability & Edit Support -->
                <div class="mt-6 border-t border-indigo-50 pt-4">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-sm font-bold text-slate-800">오늘의 학습 목록</h3>
                        <span id="totalStudyTimeBadge" class="text-xs bg-indigo-50 text-indigo-700 font-semibold px-2.5 py-1 rounded-lg border border-indigo-100">총 공부 시간: 0분</span>
                    </div>
                    <div id="todoListContainer" class="space-y-3 max-h-72 overflow-y-auto pr-1">
                        <!-- Dynamic Todos -->
                    </div>
                </div>
            </div>

        </div>

        <div class="lg:col-span-5 space-y-6">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-indigo-100/60 flex flex-col h-full">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-chart-pie text-indigo-600"></i> 과목별 공부 비중 분석
                    </h2>
                    <span id="analyticsDateLabel" class="text-xs font-medium text-slate-400">날짜별 분석</span>
                </div>
                
                <!-- Donut Chart Canvas Container -->
                <div class="relative flex-grow flex items-center justify-center py-4 min-h-[260px]">
                    <canvas id="studyChart"></canvas>
                </div>

                <!-- Subject Breakdown Legend / Hours List -->
                <div class="mt-4 border-t border-indigo-50 pt-4">
                    <h3 class="text-xs font-bold text-slate-400 mb-3 uppercase tracking-wider">과목별 누적 학습 시간</h3>
                    <div id="subjectStatsContainer" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                        <!-- Dynamic stats -->
                    </div>
                </div>
            </div>
        </div>

    </main>

    <div id="ddayModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-xl max-w-md w-full p-6 space-y-6 relative animate-in fade-in zoom-in duration-200 border border-indigo-100">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-flag text-indigo-600"></i> 주요 시험 D-Day 관리
                </h3>
                <button onclick="closeDdayModal()" class="text-slate-400 hover:text-slate-600 p-2">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <form onsubmit="addDday(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">시험 명칭 (예: 2학기 기말고사)</label>
                    <input type="text" id="ddayTitleInput" placeholder="시험 이름 입력" required class="w-full px-4 py-2.5 bg-indigo-50/50 border border-indigo-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">시험 날짜</label>
                    <input type="date" id="ddayDateInput" required class="w-full px-4 py-2.5 bg-indigo-50/50 border border-indigo-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition shadow-sm text-sm">
                    D-Day 추가하기
                </button>
            </form>

            <div class="border-t border-indigo-50 pt-4">
                <h4 class="text-xs font-bold text-slate-400 mb-3">등록된 D-Day 목록</h4>
                <div id="ddayModalList" class="space-y-2 max-h-40 overflow-y-auto pr-1">
                    <!-- Dynamic D-Days -->
                </div>
            </div>
        </div>
    </div>

    <div id="editTodoModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-xl max-w-md w-full p-6 space-y-6 relative animate-in fade-in zoom-in duration-200 border border-indigo-100">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-indigo-600"></i> 학습 일정 수정
                </h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 p-2">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <form onsubmit="saveEditedTodo(event)" class="space-y-4">
                <input type="hidden" id="editTodoId">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">과목 선택</label>
                        <select id="editTodoSubjectSelect" required class="w-full px-4 py-2.5 bg-indigo-50/50 border border-indigo-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <!-- Dynamic Options -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">공부 시간 (분 단위)</label>
                        <input type="number" id="editTodoMinutesInput" min="0" max="1440" required class="w-full px-4 py-2.5 bg-indigo-50/50 border border-indigo-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">학습 내용 (할 일)</label>
                    <input type="text" id="editTodoTaskInput" required class="w-full px-4 py-2.5 bg-indigo-50/50 border border-indigo-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition shadow-sm text-sm">
                    수정 완료하기
                </button>
            </form>
        </div>
    </div>

    <script>
        // LocalStorage Keys
        const STORAGE_KEYS = {
            SUBJECTS: 'study_planner_subjects_v1',
            TODOS: 'study_planner_todos_v1',
            DDAYS: 'study_planner_ddays_v1'
        };

        // Default Data
        const DEFAULT_SUBJECTS = ['국어', '수학', '영어', '물리I', '화학I', '지구과학I', '한국사'];
        const DEFAULT_DDAYS = [
            { id: '1', title: '수능/모의고사', date: '2026-11-19' },
            { id: '2', title: '2학기 기말고사', date: '2026-12-10' }
        ];

        // State variables
        let subjects = JSON.parse(localStorage.getItem(STORAGE_KEYS.SUBJECTS)) || DEFAULT_SUBJECTS;
        let todos = JSON.parse(localStorage.getItem(STORAGE_KEYS.TODOS)) || [];
        let ddays = JSON.parse(localStorage.getItem(STORAGE_KEYS.DDAYS)) || DEFAULT_DDAYS;
        
        let currentDate = new Date().toISOString().split('T')[0];
        let chartInstance = null;

        // Timer State variables
        let timerSeconds = 0;
        let timerInterval = null;
        let isTimerRunning = false;

        // Unified & Harmonious Indigo/Blueberry Harmony Palette
        const COLOR_PALETTE = [
            '#4f46e5', // Indigo 600
            '#6366f1', // Indigo 500
            '#3b82f6', // Blue 500
            '#8b5cf6', // Violet 500
            '#06b6d4', // Cyan 500
            '#2563eb', // Blue 600
            '#7c3aed', // Violet 600
            '#0ea5e9', // Sky 500
            '#4338ca', // Indigo 700
            '#2563eb'  // Blue 600
        ];

        window.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('currentDateInput');
            dateInput.value = currentDate;
            dateInput.addEventListener('change', (e) => {
                currentDate = e.target.value;
                renderApp();
            });

            renderApp();
        });

        function saveData() {
            localStorage.setItem(STORAGE_KEYS.SUBJECTS, JSON.stringify(subjects));
            localStorage.setItem(STORAGE_KEYS.TODOS, JSON.stringify(todos));
            localStorage.setItem(STORAGE_KEYS.DDAYS, JSON.stringify(ddays));
        }

        function renderApp() {
            renderDdayHeader();
            renderSubjects();
            renderSubjectSelect();
            renderEditSubjectSelect();
            renderTimerSubjectSelect();
            renderTodoList();
            renderChartAndStats();
            saveData();
        }

        /* --- Timer Functions --- */
        function renderTimerSubjectSelect() {
            const select = document.getElementById('timerSubjectSelect');
            const currentVal = select.value;
            select.innerHTML = '';
            
            subjects.forEach(sub => {
                const option = document.createElement('option');
                option.value = sub;
                option.textContent = sub;
                select.appendChild(option);
            });

            if (subjects.includes(currentVal)) {
                select.value = currentVal;
            }
        }

        function updateTimerDisplay() {
            const hrs = String(Math.floor(timerSeconds / 3600)).padStart(2, '0');
            const mins = String(Math.floor((timerSeconds % 3600) / 60)).padStart(2, '0');
            const secs = String(timerSeconds % 60).padStart(2, '0');
            document.getElementById('timerDisplay').textContent = `${hrs}:${mins}:${secs}`;
        }

        function startTimer() {
            if (isTimerRunning) return;
            isTimerRunning = true;
            document.getElementById('timerStartBtn').disabled = true;
            document.getElementById('timerStartBtn').classList.add('opacity-50', 'cursor-not-allowed');
            document.getElementById('timerPauseBtn').disabled = false;
            document.getElementById('timerPauseBtn').classList.remove('opacity-50', 'cursor-not-allowed');
            document.getElementById('timerStatusLabel').textContent = '타이머 측정 중... ⏱️';

            timerInterval = setInterval(() => {
                timerSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function pauseTimer() {
            if (!isTimerRunning) return;
            isTimerRunning = false;
            clearInterval(timerInterval);
            document.getElementById('timerStartBtn').disabled = false;
            document.getElementById('timerStartBtn').classList.remove('opacity-50', 'cursor-not-allowed');
            document.getElementById('timerPauseBtn').disabled = true;
            document.getElementById('timerPauseBtn').classList.add('opacity-50', 'cursor-not-allowed');
            document.getElementById('timerStatusLabel').textContent = '타이머가 일시정지되었습니다.';
        }

        function resetTimer() {
            pauseTimer();
            timerSeconds = 0;
            updateTimerDisplay();
            document.getElementById('timerStatusLabel').textContent = '시작 버튼을 눌러 공부를 시작하세요';
        }

        function saveTimerToTodo() {
            if (timerSeconds < 10) {
                alert('최소 10초 이상 측정된 기록만 저장할 수 있습니다.');
                return;
            }

            const subject = document.getElementById('timerSubjectSelect').value;
            let task = document.getElementById('timerTaskInput').value.trim();
            if (!task) {
                task = '타이머 집중 학습';
            }

            const minutes = Math.max(1, Math.round(timerSeconds / 60));

            const newTodo = {
                id: Date.now().toString(),
                date: currentDate,
                subject: subject,
                minutes: minutes,
                task: `${task} (타이머 측정)`,
                completed: true
            };

            todos.push(newTodo);
            document.getElementById('timerTaskInput').value = '';
            resetTimer();
            renderTodoList();
            renderChartAndStats();
            saveData();
        }

        /* --- D-Day Functions --- */
        function renderDdayHeader() {
            const container = document.getElementById('ddayHeaderContainer');
            container.innerHTML = '';
            
            const today = new Date();
            today.setHours(0,0,0,0);

            ddays.forEach(d => {
                const targetDate = new Date(d.date);
                targetDate.setHours(0,0,0,0);
                const diffTime = targetDate - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                let badgeText = '';
                if (diffDays > 0) badgeText = `D-${diffDays}`;
                else if (diffDays === 0) badgeText = 'D-Day';
                else badgeText = `D+${Math.abs(diffDays)}`;

                const item = document.createElement('div');
                item.className = 'bg-indigo-600/80 backdrop-blur-sm border border-indigo-500/50 px-3 py-1.5 rounded-xl flex items-center gap-2 text-xs whitespace-nowrap shadow-sm text-white';
                item.innerHTML = `
                    <span class="font-medium text-indigo-100">${d.title}</span>
                    <span class="bg-white text-indigo-700 font-bold px-1.5 py-0.5 rounded-md shadow-xs">${badgeText}</span>
                `;
                container.appendChild(item);
            });
        }

        function openDdayModal() {
            document.getElementById('ddayModal').classList.remove('hidden');
            renderDdayModalList();
        }

        function closeDdayModal() {
            document.getElementById('ddayModal').classList.add('hidden');
            renderDdayHeader();
        }

        function renderDdayModalList() {
            const listContainer = document.getElementById('ddayModalList');
            listContainer.innerHTML = '';
            
            if (ddays.length === 0) {
                listContainer.innerHTML = '<p class="text-xs text-slate-400 text-center py-2">등록된 D-Day가 없습니다.</p>';
                return;
            }

            ddays.forEach(d => {
                const row = document.createElement('div');
                row.className = 'flex justify-between items-center bg-indigo-50/50 px-3 py-2 rounded-xl text-sm border border-indigo-100';
                row.innerHTML = `
                    <div>
                        <span class="font-semibold text-slate-700">${d.title}</span>
                        <span class="text-xs text-slate-400 ml-2">(${d.date})</span>
                    </div>
                    <button onclick="deleteDday('${d.id}')" class="text-red-400 hover:text-red-600 text-xs p-1">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                `;
                listContainer.appendChild(row);
            });
        }

        function addDday(e) {
            e.preventDefault();
            const titleInput = document.getElementById('ddayTitleInput');
            const dateInput = document.getElementById('ddayDateInput');
            
            const newDday = {
                id: Date.now().toString(),
                title: titleInput.value.trim(),
                date: dateInput.value
            };

            ddays.push(newDday);
            titleInput.value = '';
            dateInput.value = '';
            renderDdayModalList();
            renderDdayHeader();
            saveData();
        }

        function deleteDday(id) {
            ddays = ddays.filter(d => d.id !== id);
            renderDdayModalList();
            renderDdayHeader();
            saveData();
        }

        /* --- Subject Management Functions --- */
        function renderSubjects() {
            const container = document.getElementById('subjectListContainer');
            container.innerHTML = '';

            subjects.forEach((sub, idx) => {
                const color = COLOR_PALETTE[idx % COLOR_PALETTE.length];
                const badge = document.createElement('div');
                badge.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold text-white shadow-sm';
                badge.style.backgroundColor = color;
                badge.innerHTML = `
                    <span>${sub}</span>
                    <button onclick="deleteSubject('${sub}')" class="hover:text-indigo-200 ml-1 transition">
                        <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                `;
                container.appendChild(badge);
            });
        }

        function renderSubjectSelect() {
            const select = document.getElementById('todoSubjectSelect');
            select.innerHTML = '';
            
            subjects.forEach(sub => {
                const option = document.createElement('option');
                option.value = sub;
                option.textContent = sub;
                select.appendChild(option);
            });
        }

        function renderEditSubjectSelect() {
            const select = document.getElementById('editTodoSubjectSelect');
            select.innerHTML = '';
            
            subjects.forEach(sub => {
                const option = document.createElement('option');
                option.value = sub;
                option.textContent = sub;
                select.appendChild(option);
            });
        }

        function addSubject() {
            const input = document.getElementById('newSubjectInput');
            const val = input.value.trim();
            if (!val) return;
            if (subjects.includes(val)) {
                alert('이미 존재하는 과목입니다.');
                return;
            }

            subjects.push(val);
            input.value = '';
            renderApp();
        }

        function deleteSubject(subName) {
            if (subjects.length <= 1) {
                alert('최소 1개 이상의 과목이 있어야 합니다.');
                return;
            }
            subjects = subjects.filter(s => s !== subName);
            renderApp();
        }

        /* --- Todo Management Functions --- */
        function addTodo(e) {
            e.preventDefault();
            const subject = document.getElementById('todoSubjectSelect').value;
            const minutes = parseInt(document.getElementById('todoMinutesInput').value) || 0;
            const task = document.getElementById('todoTaskInput').value.trim();

            if (!task) return;

            const newTodo = {
                id: Date.now().toString(),
                date: currentDate,
                subject: subject,
                minutes: minutes,
                task: task,
                completed: false
            };

            todos.push(newTodo);
            document.getElementById('todoTaskInput').value = '';
            document.getElementById('todoMinutesInput').value = '30';
            renderTodoList();
            renderChartAndStats();
            saveData();
        }

        function toggleTodo(id) {
            todos = todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            renderTodoList();
            renderChartAndStats();
            saveData();
        }

        function deleteTodo(id) {
            todos = todos.filter(t => t.id !== id);
            renderTodoList();
            renderChartAndStats();
            saveData();
        }

        function openEditModal(id) {
            const todo = todos.find(t => t.id === id);
            if (!todo) return;

            document.getElementById('editTodoId').value = todo.id;
            document.getElementById('editTodoSubjectSelect').value = todo.subject;
            document.getElementById('editTodoMinutesInput').value = todo.minutes;
            document.getElementById('editTodoTaskInput').value = todo.task;

            document.getElementById('editTodoModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editTodoModal').classList.add('hidden');
        }

        function saveEditedTodo(e) {
            e.preventDefault();
            const id = document.getElementById('editTodoId').value;
            const subject = document.getElementById('editTodoSubjectSelect').value;
            const minutes = parseInt(document.getElementById('editTodoMinutesInput').value) || 0;
            const task = document.getElementById('editTodoTaskInput').value.trim();

            if (!task) return;

            todos = todos.map(t => t.id === id ? { ...t, subject, minutes, task } : t);
            closeEditModal();
            renderTodoList();
            renderChartAndStats();
            saveData();
        }

        function renderTodoList() {
            const container = document.getElementById('todoListContainer');
            container.innerHTML = '';

            const filteredTodos = todos.filter(t => t.date === currentDate);
            
            const totalMinutes = filteredTodos.reduce((acc, cur) => acc + (cur.completed ? cur.minutes : 0), 0);
            const hours = Math.floor(totalMinutes / 60);
            const mins = totalMinutes % 60;
            document.getElementById('totalStudyTimeBadge').textContent = `달성 공부 시간: ${hours > 0 ? hours + '시간 ' : ''}${mins}분`;

            if (filteredTodos.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-slate-400 text-xs bg-indigo-50/40 rounded-2xl border border-dashed border-indigo-100">선택한 날짜에 등록된 학습 일정이 없습니다.</div>';
                return;
            }

            filteredTodos.forEach(t => {
                const subIdx = subjects.indexOf(t.subject);
                const color = subIdx !== -1 ? COLOR_PALETTE[subIdx % COLOR_PALETTE.length] : '#4f46e5';

                const card = document.createElement('div');
                card.className = `flex items-center justify-between p-4 rounded-2xl border transition shadow-sm ${t.completed ? 'bg-indigo-50/40 border-indigo-100 opacity-75' : 'bg-white border-indigo-100/60 hover:border-indigo-300'}`;
                card.innerHTML = `
                    <div class="flex items-center gap-3.5 overflow-hidden flex-grow mr-3">
                        <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTodo('${t.id}')" class="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500 cursor-pointer flex-shrink-0">
                        <div class="overflow-hidden flex-grow">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="px-2.5 py-0.5 rounded-lg text-[11px] font-bold text-white shadow-xs" style="background-color: ${color}">${t.subject}</span>
                                <span class="text-xs bg-indigo-50 text-indigo-700 font-semibold px-2 py-0.5 rounded-md"><i class="fa-regular fa-clock mr-1 text-[10px]"></i>${t.minutes}분</span>
                            </div>
                            <p class="text-sm font-semibold text-slate-800 break-words ${t.completed ? 'line-through text-slate-400 font-normal' : ''}">${t.task}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 flex-shrink-0">
                        <button onclick="openEditModal('${t.id}')" class="text-slate-400 hover:text-indigo-600 p-2 transition rounded-lg hover:bg-indigo-50" title="수정">
                            <i class="fa-solid fa-pen text-xs"></i>
                        </button>
                        <button onclick="deleteTodo('${t.id}')" class="text-slate-400 hover:text-red-500 p-2 transition rounded-lg hover:bg-indigo-50" title="삭제">
                            <i class="fa-solid fa-trash text-xs"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        /* --- Analytics & Chart Functions --- */
        function renderChartAndStats() {
            document.getElementById('analyticsDateLabel').textContent = `${currentDate} 기준`;
            
            const filteredTodos = todos.filter(t => t.date === currentDate && t.completed);

            const stats = {};
            subjects.forEach(s => stats[s] = 0);
            filteredTodos.forEach(t => {
                if (stats[t.subject] !== undefined) {
                    stats[t.subject] += t.minutes;
                } else {
                    stats[t.subject] = t.minutes;
                }
            });

            const labels = [];
            const dataValues = [];
            const backgroundColors = [];

            subjects.forEach((sub, idx) => {
                const mins = stats[sub];
                if (mins > 0) {
                    labels.push(sub);
                    dataValues.push(mins);
                    backgroundColors.push(COLOR_PALETTE[idx % COLOR_PALETTE.length]);
                }
            });

            const statsContainer = document.getElementById('subjectStatsContainer');
            statsContainer.innerHTML = '';

            const totalMins = dataValues.reduce((a, b) => a + b, 0);

            if (labels.length === 0) {
                statsContainer.innerHTML = '<p class="text-xs text-slate-400 text-center py-4 bg-indigo-50/40 rounded-xl border border-dashed border-indigo-100">완료된 학습 기록이 없어 비중을 표시할 수 없습니다.</p>';
            } else {
                subjects.forEach((sub, idx) => {
                    const mins = stats[sub];
                    if (mins > 0) {
                        const percent = totalMins > 0 ? ((mins / totalMins) * 100).toFixed(1) : 0;
                        const color = COLOR_PALETTE[idx % COLOR_PALETTE.length];
                        
                        const row = document.createElement('div');
                        row.className = 'flex items-center justify-between text-xs bg-indigo-50/40 p-3 rounded-xl border border-indigo-100/60';
                        row.innerHTML = `
                            <div class="flex items-center gap-2.5">
                                <span class="w-3.5 h-3.5 rounded-full shadow-xs" style="background-color: ${color}"></span>
                                <span class="font-bold text-slate-700">${sub}</span>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="text-slate-500 font-medium">${mins}분</span>
                                <span class="font-bold text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded-lg border border-indigo-100">${percent}%</span>
                            </div>
                        `;
                        statsContainer.appendChild(row);
                    }
                });
            }

            const ctx = document.getElementById('studyChart').getContext('2d');
            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels.length > 0 ? labels : ['기록 없음'],
                    datasets: [{
                        data: dataValues.length > 0 ? dataValues : [1],
                        backgroundColor: backgroundColors.length > 0 ? backgroundColors : ['#e0e7ff'],
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                boxWidth: 12,
                                font: {
                                    family: 'Pretendard',
                                    size: 11,
                                    weight: '600'
                                },
                                color: '#334155'
                            }
                        }
                    },
                    cutout: '65%'
                }
            });
        }
    </script>
</body>
</html>
